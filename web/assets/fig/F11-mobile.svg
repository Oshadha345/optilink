<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 956" width="700" height="956" role="img" aria-labelledby="t d">
<title id="t">Isolation harm: events per 1,000 patient-days</title>
<desc id="d">Bar chart from Stelfox et al., JAMA 2003, safety of patients isolated for infection control, in events per 1,000 patient-days. Adverse events: 15 not isolated, 31 isolated. Preventable events: 3 not isolated, 20 isolated. Isolated patients were also 8 times more likely to make a formal complaint (8% vs 1%).</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="30" y="56" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Stelfox et al., JAMA 2003: safety of patients</text>
<text x="30" y="90" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">isolated for infection control</text>
<text x="30" y="170" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Adverse events</text>
<text x="30" y="212" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">not isolated</text>
<g><rect x="30" y="224" width="225" height="52" rx="8" fill="#7B96B6"/><text x="271" y="262" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">15</text></g>
<text x="30" y="324" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">isolated</text>
<g><rect x="30" y="336" width="465" height="52" rx="8" fill="#D63B31"/><text x="511" y="374" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">31</text></g>
<text x="30" y="458" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Preventable events</text>
<text x="30" y="500" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">not isolated</text>
<g><rect x="30" y="512" width="45" height="52" rx="8" fill="#7B96B6"/><text x="91" y="550" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">3</text></g>
<text x="30" y="612" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">isolated</text>
<g><rect x="30" y="624" width="300" height="52" rx="8" fill="#D63B31"/><text x="346" y="662" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">20</text></g>
<text x="30" y="746" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Events per 1,000 patient-days. Isolated patients were also</text>
<text x="30" y="777" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">8 times more likely to make a formal complaint (8% vs 1%).</text>
<text x="30" y="890" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">Source: Stelfox et al., JAMA 2003</text>
</svg>
