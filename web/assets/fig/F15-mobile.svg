<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1040" width="700" height="1040" role="img" aria-labelledby="t d">
<title id="t">Cost per bed, Rs (logarithmic axis)</title>
<desc id="d">Range bars of cost per bed in Rs on a logarithmic axis. OptiLink ward kit: about Rs 9,500 per bed (build cost; 1 station, 10 beds and 6 chargers, about Rs 95,300). Wireless call button with no content: Rs 2,062 to 6,637. Tablet with an app: Rs 24,249 to 126,666. Hospital nurse-call system: Rs 46,500 to 216,000 plus installation. Proloquo2Go with an iPad: about Rs 210,000 and up. Not shown: Tobii Dynavox speech devices at Rs 1.3 to 3.3 million each.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Space Grotesk Bold';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="30" y="56" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="32" fill="#F2F4F7" text-anchor="start">Cost per bed, Rs</text>
<text x="30" y="92" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#7C92AB" text-anchor="start">Logarithmic axis: each gridline is ten times</text>
<text x="30" y="118" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#7C92AB" text-anchor="start">the one before.</text>
<line x1="40" y1="160" x2="40" y2="800" stroke="#3F4E61" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>
<text x="40" y="828" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#7C92AB" text-anchor="middle">1,000</text>
<line x1="288.031" y1="160" x2="288.031" y2="800" stroke="#3F4E61" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>
<text x="288.031" y="828" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#7C92AB" text-anchor="middle">10,000</text>
<line x1="536.062" y1="160" x2="536.062" y2="800" stroke="#3F4E61" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>
<text x="536.062" y="828" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#7C92AB" text-anchor="middle">100,000</text>
<g id="row-optilink" data-motion-step="1"><text x="30" y="200" font-family="OL Space Grotesk Bold,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">OptiLink ward kit</text><text x="262" y="200" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">build cost</text><path d="M268.506 240 l14 -14 l14 14 l-14 14 z" fill="#E8E1CC" stroke="#E8E1CC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="308.506" y="246" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="22" fill="#F2F4F7" text-anchor="start">about 9,500</text><text x="30" y="284" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">1 station + 10 beds + 6 chargers</text><path d="M332.922 276.4 q2.66 -3.192 5.32 0 t5.32 0" fill="none" stroke="#A3ADBB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.922 280.58 q2.66 -3.192 5.32 0 t5.32 0" fill="none" stroke="#A3ADBB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="351.562" y="284" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">Rs 95,300</text></g>
<g id="row-2" data-motion-step="2"><text x="30" y="328" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Wireless call button (no content)</text><rect x="117.953" y="350" width="125.921" height="30" rx="6" fill="#7B96B6"/><text x="255.875" y="374" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="19" fill="#F2F4F7" text-anchor="start">2,062–6,637</text></g>
<g id="row-3" data-motion-step="3"><text x="30" y="456" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Tablet with an app</text><rect x="383.447" y="478" width="178.078" height="30" rx="6" fill="#7B96B6"/><text x="371.447" y="502" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="19" fill="#F2F4F7" text-anchor="end">24,249–126,666</text></g>
<g id="row-4" data-motion-step="4"><text x="30" y="584" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Hospital nurse-call system</text><rect x="453.58" y="606" width="165.437" height="30" rx="6" fill="#7B96B6"/><text x="441.58" y="630" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="19" fill="#F2F4F7" text-anchor="end">46,500–216,000</text><text x="453.58" y="666" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">plus installation</text></g>
<g id="row-5" data-motion-step="5"><text x="30" y="712" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Proloquo2Go with an iPad</text><rect x="615.982" y="734" width="44.0175" height="30" rx="6" fill="#7B96B6"/><text x="603.982" y="758" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="19" fill="#F2F4F7" text-anchor="end">about 210,000+</text></g>
<text x="30" y="880" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">Not shown: Tobii Dynavox speech devices at Rs 1.3–3.3 million each.</text>
<text x="30" y="908" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">Nurse-call converted at USD 140–650 per bed and Rs 332.4 per</text>
<text x="30" y="936" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">dollar.</text>
<text x="30" y="964" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">Two Galaxy Tab A9 tablets cost Rs 83,880. OptiLink figure is a build</text>
<text x="30" y="992" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">cost, not a selling price.</text>
</svg>
