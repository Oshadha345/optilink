<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="t d">
<title id="t">Several beds: one Doctor Station, fourteen Bed Units</title>
<desc id="d">One Doctor Station, address 0, in the centre, and fourteen numbered Bed Units, 1 to 14, around it. The Doctor Station talks to one selected bed at a time, shown by the highlighted line with an infrared dot, but it receives from every bed.</desc>
