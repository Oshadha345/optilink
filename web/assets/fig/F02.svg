<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-labelledby="t d">
<title id="t">Frame structure: one small, checked frame</title>
<desc id="d">A frame is one small checked message. From left to right: preamble (sync), start (1 byte), then destination, source and type (11 bits together), sequence (1 bit), phrase ID (12 bits) and CRC-8 (8 bits). The last four fields together are 32 bits of payload. The link is a 940 nm infrared LED on a 38 kHz carrier, 2400 baud, Manchester coded. Doctor Station is address 0, Bed Units 1 to 14. Seven frame types: question or phrase, acknowledgement, answer, request, number for an instruction, link check, typed text.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
