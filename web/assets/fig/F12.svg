<text x="766.05" y="448.68" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#F2F4F7" text-anchor="end">Hospital nurse-call</text>
<circle cx="218.56" cy="474.83" r="9" fill="#0B0D10" stroke="#A9BBD0" stroke-width="2"/>
<text x="238.56" y="481.83" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#F2F4F7" text-anchor="start">Wireless call button</text>
<text x="60" y="680" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Positions are our judgement, not measurements.</text>
<text x="60" y="714" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#A3ADBB" text-anchor="start">We never claim to be “the first” or “the only”.</text>
