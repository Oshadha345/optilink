<text x="134" y="82" font-family="OL Space Grotesk Bold,'Space Grotesk',system-ui,sans-serif" font-size="24" fill="#F2F4F7" text-anchor="start">The gap</text>
<text x="884" y="78" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#7C92AB" text-anchor="end">Rich, but a device or subscription per bed</text>
<text x="134" y="546" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#7C92AB" text-anchor="start">Cheap, but no content</text>
<text x="884" y="546" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#7C92AB" text-anchor="end">Installed systems, no content</text>
<text x="505" y="616" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#F2F4F7" text-anchor="middle">Needs network, devices, installation or cost per bed</text>
<text x="890" y="588" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#7C92AB" text-anchor="end">high</text>
