<line x1="508.08" y1="50" x2="508.08" y2="560" stroke="#3F4E61" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="120" y1="300.41" x2="890" y2="300.41" stroke="#3F4E61" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="120" y1="560" x2="120" y2="36" stroke="#A9BBD0" stroke-width="1.5" marker-end="url(#arL)" stroke-linecap="round"/>
