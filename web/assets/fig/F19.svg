<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" role="img" aria-labelledby="t d">
<title id="t">Outline dimensions of the enclosure</title>
<desc id="d">Outline dimensions in millimetres, three views of the OptiLink Lift enclosure. Front view: 95.0 wide, 162.0 tall, with the OLED window 35.6 by 20.6, a switch opening, the LOW BATTERY light and a keypad foil slot 24 by 5. Side view: 36.0 overall, body and front joined at a seam, 27.0 to the seam. Back view: battery cover 80 by 43.4 in an 80.8 recess. The switch opening height is not yet confirmed and is not stated.</desc>
