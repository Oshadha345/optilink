<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 730" width="1600" height="730" role="img" aria-labelledby="t d">
<title id="t">Cost per bed, Rs (log axis, bar = range; bar end = upper price)</title>
<desc id="d">Range bars of cost per bed in Rs on a logarithmic axis; each bar is a price range and its right end is the upper price. OptiLink: about Rs 6,244 per bed, shown as a single red marker (a 10-bed ward kit of 1 Doctor Station and 10 Bed Units is Rs 62,436, or Rs 70,116 with 6 chargers; a build cost, not a selling price). Call bell (says only come): Rs 2,062 to 6,637. Tablet plus translator: Rs 24,249 to 41,940 (two Galaxy Tab A9 tablets cost Rs 83,880). Nurse-call system: Rs 46,500 to 216,000, plus installation.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Space Grotesk Bold';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="60" y="70" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="34" fill="#F2F4F7" text-anchor="start">Cost per bed, Rs</text>
<text x="60" y="106" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#7C92AB" text-anchor="start">Logarithmic axis: each gridline is ten times the one before. Each bar is a range; its right end is the upper price.</text>
<line x1="560.000" y1="140" x2="560.000" y2="560" stroke="#3F4E61" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>
<text x="560" y="590" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#7C92AB" text-anchor="middle">1,000</text>
<line x1="944.048" y1="140" x2="944.048" y2="560" stroke="#3F4E61" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>
<text x="944.048" y="590" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#7C92AB" text-anchor="middle">10,000</text>
<line x1="1328.096" y1="140" x2="1328.096" y2="560" stroke="#3F4E61" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>
<text x="1328.1" y="590" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#7C92AB" text-anchor="middle">100,000</text>
<g id="row-optilink" data-motion-step="1"><text x="60" y="178" font-family="OL Space Grotesk Bold,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">OptiLink</text><text x="60" y="210" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">build cost</text><path d="M849.496 170 l16 -16 l16 16 l-16 16 z" fill="#D63B31" stroke="#D63B31" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="911.496" y="174" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="24" fill="#F2F4F7" text-anchor="start">about 6,244</text><text x="911.496" y="204" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">10-bed ward kit: Rs 62,436 (Rs 70,116 with 6 chargers)</text></g>
<g id="row-2" data-motion-step="2"><text x="60" y="278" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="23" fill="#F2F4F7" text-anchor="start">Call bell (says only come)</text><rect x="680.702" y="252" width="194.975" height="36" rx="6" fill="#7B96B6"/><text x="889.677" y="278" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#F2F4F7" text-anchor="start">2,062–6,637</text></g>
<g id="row-3" data-motion-step="3"><text x="60" y="378" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="23" fill="#F2F4F7" text-anchor="start">Tablet + translator</text><rect x="1091.789" y="352" width="91.378" height="36" rx="6" fill="#7B96B6"/><text x="1197.17" y="378" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#F2F4F7" text-anchor="start">24,249–41,940</text></g>
<g id="row-4" data-motion-step="4"><text x="60" y="478" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="23" fill="#F2F4F7" text-anchor="start">Nurse-call system</text><rect x="1200.382" y="452" width="256.160" height="36" rx="6" fill="#7B96B6"/><text x="1186.38" y="478" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="20" fill="#F2F4F7" text-anchor="end">46,500–216,000 plus installation</text></g>
<text x="60" y="650" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#A3ADBB" text-anchor="start">Two Galaxy Tab A9 tablets cost Rs 83,880.</text>
<text x="60" y="680" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#A3ADBB" text-anchor="start">10-bed ward: 1 Doctor Station + 10 Bed Units = Rs 62,436 (Rs 70,116 with 6 chargers). OptiLink figure is a build cost, not a selling price.</text>
</svg>
