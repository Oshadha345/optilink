<line x1="357.28" y1="40" x2="357.28" y2="540" stroke="#3F4E61" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="70" y1="285.5" x2="640" y2="285.5" stroke="#3F4E61" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="70" y1="540" x2="70" y2="26" stroke="#A9BBD0" stroke-width="1.5" marker-end="url(#arL)" stroke-linecap="round"/>
<line x1="70" y1="540" x2="650" y2="540" stroke="#A9BBD0" stroke-width="1.5" marker-end="url(#arL)" stroke-linecap="round"/>
<text x="84" y="72" font-family="OL Space Grotesk Bold,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">The gap</text>
<text x="634" y="68" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="16" fill="#7C92AB" text-anchor="end">Rich, but a device or</text>
<text x="634" y="92" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="16" fill="#7C92AB" text-anchor="end">subscription per bed</text>
