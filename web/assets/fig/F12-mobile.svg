<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" width="700" height="760" role="img" aria-labelledby="t d">
<title id="t">Positioning map: where the gap sits</title>
<desc id="d">Positioning map, a two by two. Vertical axis: two-way, checked, in each person's language, low to high. Horizontal axis: needs network, devices, installation or cost per bed, low to high. Top left, shaded, is the gap: OptiLink sits there, far left and high. Top right, rich but a device or subscription per bed: tablet with Translate or video, and AAC apps and devices just above the horizontal divider. Bottom left, cheap but no content: communication board, talking through glass, wireless call button; the walkie-talkie or intercom sits on the vertical divider below the horizontal line. Bottom right, installed systems with no content: hospital nurse-call. Positions are the team's judgement, not measurements.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk Bold';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#A9BBD0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#D63B31" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#7C92AB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
