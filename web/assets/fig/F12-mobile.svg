<circle cx="186.85" cy="410.5" r="9" fill="#0B0D10" stroke="#A9BBD0" stroke-width="2"/>
<text x="206.85" y="417.5" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#F2F4F7" text-anchor="start">Talking through glass</text>
