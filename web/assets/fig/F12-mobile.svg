<text x="162.96" y="463.5" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#F2F4F7" text-anchor="start">Wireless call button</text>
<text x="30" y="680" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#F2F4F7" text-anchor="start">Positions are our judgement, not measurements.</text>
<text x="30" y="714" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#A3ADBB" text-anchor="start">We never claim to be “the first” or “the only”.</text>
