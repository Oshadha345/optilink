<text x="634" y="502" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="16" fill="#7C92AB" text-anchor="end">Installed systems,</text>
<text x="634" y="526" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="16" fill="#7C92AB" text-anchor="end">no content</text>
<text x="355" y="596" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#F2F4F7" text-anchor="middle">Needs network, devices,</text>
<text x="355" y="622" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#F2F4F7" text-anchor="middle">installation or cost per bed</text>
<text x="640" y="568" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="16" fill="#7C92AB" text-anchor="end">high</text>
