<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 926" width="760" height="926" role="img" aria-labelledby="t d">
<title id="t">Cost of one unit: Rs 7,876</title>
<desc id="d">Stacked bar of the build cost of one unit, Rs 7,876 in total: electronics Rs 2,661, 3D-printed enclosure Rs 2,170 (PLA+ at Rs 14 per gram), PCB Rs 1,600 (JLCPCB), battery and consumables Rs 1,445. A pair with one charger (Rs 1,450) costs Rs 17,202. The enclosure and PCB together are Rs 3,770, 48% of the unit cost.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="30" y="60" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="40" fill="#F2F4F7" text-anchor="start">Rs 7,876</text>
<text x="260" y="60" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="24" fill="#A3ADBB" text-anchor="start">to build one unit</text>
<g><rect x="30" y="101" width="190" height="207.474" rx="6" fill="#7B96B6"/><text x="244" y="202.737" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">Rs 2,661</text><text x="244" y="234.737" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">Electronics</text></g>
<g><rect x="30" y="310.474" width="190" height="168.823" rx="6" fill="#A9BBD0"/><text x="244" y="392.886" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">Rs 2,170</text><text x="244" y="424.886" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">3D-printed enclosure</text><text x="244" y="452.886" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">PLA+ at Rs 14/g</text></g>
<g><rect x="30" y="481.297" width="190" height="123.952" rx="6" fill="#566C86"/><text x="244" y="541.273" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">Rs 1,600</text><text x="244" y="573.273" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">PCB (JLCPCB)</text></g>
<g><rect x="30" y="607.249" width="190" height="111.751" rx="6" fill="#3F4E61"/><text x="244" y="661.125" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="30" fill="#F2F4F7" text-anchor="start">Rs 1,445</text><text x="244" y="693.125" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="start">Battery and consumables</text></g>
<text x="30" y="780" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Rs 17,202 a pair with one charger (Rs 1,450)</text>
<text x="30" y="816" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">48% enclosure and PCB (Rs 3,770)</text>
<text x="30" y="866" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">Sources: Tronic.lk, Alphatronic.lk, Daraz.lk, Ciphertecx (printing), JLCPCB</text>
<text x="30" y="892" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">(PCB).</text>
</svg>
