<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Isolation harm: events per 1,000 patient-days</title>
<desc id="d">Bar chart from Stelfox et al., JAMA 2003, safety of patients isolated for infection control, in events per 1,000 patient-days. Adverse events: 15 not isolated, 31 isolated. Preventable events: 3 not isolated, 20 isolated. Isolated patients were also 8 times more likely to make a formal complaint (8% vs 1%).</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="60" y="70" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="28" fill="#F2F4F7" text-anchor="start">Stelfox et al., JAMA 2003: safety of patients isolated for infection control</text>
<text x="60" y="186" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Adverse events</text>
<g><rect x="330" y="150" width="390" height="60" rx="8" fill="#7B96B6"/><text x="738" y="191" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#F2F4F7" text-anchor="start">15</text><text x="306" y="190" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="end">not isolated</text></g>
<g><rect x="330" y="226" width="806" height="60" rx="8" fill="#D63B31"/><text x="1154" y="267" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#F2F4F7" text-anchor="start">31</text><text x="306" y="266" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="end">isolated</text></g>
<text x="60" y="388" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Preventable events</text>
<g><rect x="330" y="352" width="78" height="60" rx="8" fill="#7B96B6"/><text x="426" y="393" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#F2F4F7" text-anchor="start">3</text><text x="306" y="392" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="end">not isolated</text></g>
<g><rect x="330" y="428" width="520" height="60" rx="8" fill="#D63B31"/><text x="868" y="469" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#F2F4F7" text-anchor="start">20</text><text x="306" y="468" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#A3ADBB" text-anchor="end">isolated</text></g>
<line x1="330" y1="140" x2="330" y2="514" stroke="#A9BBD0" stroke-width="1.5" stroke-linecap="round"/>
<text x="60" y="590" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">Events per 1,000 patient-days. Isolated patients were also 8 times more likely</text>
<text x="60" y="622" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">to make a formal complaint (8% vs 1%).</text>
<text x="60" y="674" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="start">Source: Stelfox et al., JAMA 2003</text>
<circle cx="1180" cy="140" r="0" fill="none"/>
</svg>
