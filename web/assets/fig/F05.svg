<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" width="1600" height="590" role="img" aria-labelledby="t d">
<title id="t">Memory used (firmware 4.6)</title>
<desc id="d">Memory used, firmware 4.6. Doctor Station program: 32,128 of 32,256 bytes (99.6%), almost full. Bed Unit program: about 24,460 bytes (75.8%). Phrase images in EEPROM: 29,219 of 32,768 bytes (89.2%). The Doctor Station is almost full, so the roadmap moves to a larger processor before adding features.</desc>
