<text x="1540" y="690" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#7C92AB" text-anchor="end">Schematic, not a measurement.</text>
<text x="60" y="730" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#F2F4F7" text-anchor="start">A 74HC04 inverter and a 74HC08 AND gate combine the serial TX line with the carrier. The VS1838B receiver removes the carrier and</text>
<text x="60" y="758" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#F2F4F7" text-anchor="start">returns clean serial data to RX.</text>
