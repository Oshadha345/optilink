<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Transmitter waveform: the LED flashes at 38 kHz only while a data bit is low</title>
<desc id="d">Three aligned waveforms. Top: a continuous 38 kHz carrier from Timer2. Middle: Inverted TX with three high pulses, short, long, short. Bottom: the IR LED, which carries 38 kHz bursts only during those three pulses (carrier AND inverted TX). Schematic, not a measurement.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="60" y="64" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="30" fill="#F2F4F7" text-anchor="start">The LED flashes at 38 kHz only while a data bit is low, like a TV remote</text>
<line x1="520" y1="120" x2="520" y2="650" stroke="#3F4E61" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="620" y1="120" x2="620" y2="650" stroke="#3F4E61" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="740" y1="120" x2="740" y2="650" stroke="#3F4E61" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="980" y1="120" x2="980" y2="650" stroke="#3F4E61" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="1100" y1="120" x2="1100" y2="650" stroke="#3F4E61" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="1200" y1="120" x2="1200" y2="650" stroke="#3F4E61" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<text x="60" y="168" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Carrier</text>
<text x="60" y="202" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">38 kHz from Timer2</text>
<text x="60" y="368" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">Inverted TX</text>
<text x="60" y="402" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">three pulses: short, long, short</text>
<text x="60" y="568" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">IR LED</text>
<text x="60" y="602" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="19" fill="#A3ADBB" text-anchor="start">940 nm, about 100 mA pulses</text>
