<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1060" width="800" height="1060" role="img" aria-labelledby="t d">
<title id="t">Battery thresholds: three states</title>
<desc id="d">Battery monitor with a 100k and 47k divider, shown as three zones, not to scale. Above 7.0 V: Normal. 6.4 to 7.0 V: LOW, the red light blinks, one beep, warning. Below 6.4 V: CRITICAL, light on, three beeps, and a Bed Unit also alerts the Doctor Station. A 0.2 V hysteresis stops flickering between levels. The screen sleeps after inactivity to save power.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="60" y="64" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="28" fill="#F2F4F7" text-anchor="start">Battery monitor (100k / 47k divider)</text>
<rect x="130" y="111" width="130" height="288" rx="10" fill="#7B96B6"/>
<rect x="130" y="401" width="130" height="228" rx="10" fill="#3F4E61"/>
<rect x="130" y="631" width="130" height="288" rx="10" fill="#B23128"/>
<circle cx="195" cy="515" r="22" fill="#0B0D10" stroke="#D63B31" stroke-width="3"/>
<circle cx="195" cy="515" r="38" fill="none" stroke="#D63B31" stroke-opacity=".45" stroke-width="1.5"/>
<circle cx="195" cy="750" r="22" fill="#D63B31" stroke="#E8E1CC" stroke-width="2"/>
<line x1="110" y1="400" x2="280" y2="400" stroke="#A9BBD0" stroke-width="1.5" stroke-linecap="round"/>
<text x="100" y="407" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="24" fill="#F2F4F7" text-anchor="end">7.0 V</text>
<line x1="110" y1="630" x2="280" y2="630" stroke="#A9BBD0" stroke-width="1.5" stroke-linecap="round"/>
<text x="100" y="637" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="24" fill="#F2F4F7" text-anchor="end">6.4 V</text>
<text x="330" y="190" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="28" fill="#F2F4F7" text-anchor="start">above 7.0 V</text>
<text x="330" y="228" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#A3ADBB" text-anchor="start">Normal</text>
<text x="330" y="480" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="28" fill="#F2F4F7" text-anchor="start">6.4–7.0 V</text>
<text x="330" y="518" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">LOW</text>
<text x="330" y="552" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#A3ADBB" text-anchor="start">red light blinks, one beep, warning</text>
<text x="330" y="710" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="28" fill="#F2F4F7" text-anchor="start">below 6.4 V</text>
<text x="330" y="748" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#F2F4F7" text-anchor="start">CRITICAL</text>
<text x="330" y="782" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#A3ADBB" text-anchor="start">light on, three beeps; a Bed Unit also</text>
<text x="330" y="810" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#A3ADBB" text-anchor="start">alerts the Doctor Station</text>
<text x="60" y="960" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#A3ADBB" text-anchor="start">0.2 V hysteresis stops flickering between levels. The screen sleeps</text>
<text x="60" y="988" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#A3ADBB" text-anchor="start">after inactivity to save power.</text>
<text x="60" y="1030" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#7C92AB" text-anchor="start">Zone heights are not to scale.</text>
</svg>
