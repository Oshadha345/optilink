<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="1800" height="900" role="img" aria-labelledby="t d">
<title id="t">Bill of materials: Rs 5,676 per unit</title>
<desc id="d">Ranked bars of the build cost of one unit, Rs 5,676 in total: ATmega328P-PU with Uno bootloader Rs 230; 1.3-inch SH1106 OLED display Rs 950; 4 x 4 membrane keypad and 8-way extension Rs 210; MP1584 buck converter Rs 230; AT24C256 phrase-memory EEPROM Rs 80; IR parts, buzzer, power parts, passives and IC sockets Rs 431; PCB Rev 1.7 made in the faculty manufacturing lab and soldered by us Rs 0; 3D-printed PLA+ case Rs 2,170; 9 V NiMH rechargeable battery Rs 1,180; foam tape, link wire, solder and ribbon Rs 195. A pair (Doctor Station and Bed Unit) costs Rs 11,352. The optional dual-slot charger, one per pair, is Rs 1,280, so a pair with charger costs Rs 12,632 (about USD 38). About USD 17 per unit at Rs 332.</desc>
