<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600" role="img" aria-labelledby="t d">
<title id="t">Cost of one unit: Rs 7,876</title>
<desc id="d">Stacked bar of the build cost of one unit, Rs 7,876 in total: electronics Rs 2,661, 3D-printed enclosure Rs 2,170 (PLA+ at Rs 14 per gram), PCB Rs 1,600 (JLCPCB), battery and consumables Rs 1,445. A pair with one charger (Rs 1,450) costs Rs 17,202. The enclosure and PCB together are Rs 3,770, 48% of the unit cost.</desc>
<defs><style>@font-face{font-family:'OL Space Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'OL Poppins';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style></defs>
<text x="100" y="56" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="40" fill="#F2F4F7" text-anchor="start">Rs 7,876</text>
<text x="300" y="56" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="26" fill="#A3ADBB" text-anchor="start">to build one unit</text>
<g><rect x="101" y="90" width="538.579" height="150" rx="6" fill="#7B96B6"/><text x="124" y="152" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#0B0D10" text-anchor="start">Rs 2,661</text><text x="124" y="192" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#0B0D10" text-anchor="start">Electronics</text></g>
<g><rect x="641.579" y="90" width="438.833" height="150" rx="6" fill="#A9BBD0"/><text x="664.579" y="152" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#0B0D10" text-anchor="start">Rs 2,170</text><text x="664.579" y="192" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#0B0D10" text-anchor="start">3D-printed enclosure</text><text x="664.579" y="220" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="18" fill="#0B0D10" text-anchor="start">PLA+ at Rs 14/g</text></g>
<g><rect x="1082.41" y="90" width="323.038" height="150" rx="6" fill="#566C86"/><text x="1105.41" y="152" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#F2F4F7" text-anchor="start">Rs 1,600</text><text x="1105.41" y="192" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="22" fill="#F2F4F7" text-anchor="start">PCB (JLCPCB)</text></g>
<g><rect x="1407.45" y="90" width="291.55" height="150" rx="6" fill="#3F4E61"/><text x="1430.45" y="152" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="32" fill="#F2F4F7" text-anchor="start">Rs 1,445</text><text x="1430.45" y="192" font-family="OL Space Grotesk,'Space Grotesk',system-ui,sans-serif" font-size="20" fill="#F2F4F7" text-anchor="start">Battery and consumables</text></g>
<rect x="100" y="320" width="520" height="130" rx="16" fill="#14171C" stroke="#3F4E61" stroke-width="1"/>
<text x="132" y="382" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="40" fill="#F2F4F7" text-anchor="start">Rs 17,202</text>
<text x="132" y="420" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#A3ADBB" text-anchor="start">a pair with one charger (Rs 1,450)</text>
<rect x="660" y="320" width="520" height="130" rx="16" fill="#14171C" stroke="#3F4E61" stroke-width="1"/>
<text x="692" y="382" font-family="OL JetBrains Mono,'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="40" fill="#F2F4F7" text-anchor="start">48%</text>
<text x="692" y="420" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="21" fill="#A3ADBB" text-anchor="start">enclosure and PCB (Rs 3,770)</text>
<text x="100" y="560" font-family="OL Poppins,'Poppins',system-ui,sans-serif" font-size="20" fill="#7C92AB" text-anchor="start">Sources: Tronic.lk, Alphatronic.lk, Daraz.lk, Ciphertecx (printing), JLCPCB (PCB).</text>
